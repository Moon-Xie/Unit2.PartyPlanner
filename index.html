<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit2_block21_PartyPlanner</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <h1>Party Planner</h1>
    <ul id="party-list"></ul>
    <form id="party-form">
      <h2>Add a Party</h2>
      <label>
        Name: <input type="text" id="name" required>
      </label><br><br>
      <label>
        Date: <input type="date" id="date" required>
      </label><br><br>
      <label>
        Time: <input type="time" id="time" required>
      </label><br><br>
      <label>
        Location: <input type="text" id="location" required>
      </label><br><br>
      <label>
        Description: <textarea id="description" required></textarea>
      </label><br><br>
      <button type="submit">Add Party</button>
    </form>
    <script src="index.js"></script>
  </body>
</html>
